<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeFollowers — your cookie cloud</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ── graph canvas ── */
    #graph-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    svg {
      width: 100%;
      height: 100%;
    }

    /* ── node styles (set via JS but defined here for reference) ── */
    .node-site     { fill: #3b82f6; }   /* blue  — sites you visited */
    .node-tracker  { fill: #ef4444; }   /* red   — ad/tracking */
    .node-analytics{ fill: #f97316; }   /* orange — analytics */
    .node-social   { fill: #a855f7; }   /* purple — social media */
    .node-cdn      { fill: #6b7280; }   /* grey  — CDN / functional */
    .node-unknown  { fill: #64748b; }   /* slate — unknown */

    .node circle {
      stroke: rgba(255,255,255,0.15);
      stroke-width: 1px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .node circle:hover { stroke: white; stroke-width: 2px; }

    .node text {
      fill: rgba(255,255,255,0.75);
      font-size: 10px;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .link {
      stroke: rgba(255,255,255,0.12);
      stroke-width: 1px;
    }
    .link:hover { stroke: rgba(255,255,255,0.5); }

    /* ── top bar ── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 20px;
      z-index: 100;
    }

    #topbar h1 {
      font-size: 15px;
      font-weight: 600;
      color: white;
      letter-spacing: -0.3px;
    }

    .stat {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }
    .stat span {
      color: white;
      font-weight: 500;
    }

    #live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
      margin-left: auto;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }

    /* ── legend ── */
    #legend {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 11px;
      z-index: 100;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      color: rgba(255,255,255,0.7);
    }
    .legend-item:last-child { margin-bottom: 0; }
    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── tooltip ── */
    #tooltip {
      position: fixed;
      background: rgba(10,10,15,0.95);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 12px;
      max-width: 260px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 200;
      line-height: 1.6;
    }
    #tooltip.visible { opacity: 1; }
    #tooltip h3 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: white;
    }
    #tooltip .tt-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 3px;
    }
    #tooltip .tt-row span:last-child {
      color: white;
      text-align: right;
    }
    #tooltip .tt-cookies {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5);
      font-size: 11px;
    }
    #tooltip .tt-cookies strong {
      color: rgba(255,255,255,0.8);
      display: block;
      margin-bottom: 3px;
    }


    /* ── graph mode toggle ── */
    #mode-toggle {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 3px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
    }

    .mode-btn {
      border: 0;
      border-radius: 5px;
      padding: 5px 10px;
      background: transparent;
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .mode-btn:hover { color: rgba(255,255,255,0.85); }

    .mode-btn.active {
      background: rgba(230,57,70,0.22);
      color: #fff;
    }

    #mode-note {
      position: fixed;
      top: 58px;
      left: 20px;
      z-index: 99;
      padding: 7px 10px;
      border-radius: 6px;
      background: rgba(10,10,15,0.78);
      border: 1px solid rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.42);
      font-size: 10px;
      pointer-events: none;
    }

    /* ── waiting state ── */
    #waiting {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgba(255,255,255,0.4);
      font-size: 14px;
      line-height: 2;
      pointer-events: none;
    }
    #waiting.hidden { display: none; }
  </style>
</head>
<body>

<!-- top bar -->
<div id="topbar">
  <h1>FreeFollowers</h1>
  <div class="stat">Sites visited: <span id="stat-sites">0</span></div>
  <div class="stat">Trackers found: <span id="stat-trackers">0</span></div>
  <div class="stat">Connections: <span id="stat-edges">0</span></div>
  <div id="mode-toggle" title="Switch between trackers seen this session and all tracker-cookie domains already stored in the browser">
    <button id="mode-new" class="mode-btn active" type="button">New trackers</button>
    <button id="mode-all" class="mode-btn" type="button">All trackers</button>
  </div>
  <div id="live-dot" title="Updating live"></div>
  <button onclick="fitGraph()" style="
    margin-left:12px; padding:4px 12px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:6px; color:white;
    font-size:12px; cursor:pointer;">
    Fit all
  </button>
</div>
<div id="mode-note">New trackers = observed during this browser session</div>

<!-- waiting message shown before any data arrives -->
<div id="waiting">
  <div style="font-size:32px;margin-bottom:12px;">🕸️</div>
  <div>Browse any website in Edge</div>
  <div>Your cookie cloud will appear here</div>
</div>

<!-- legend -->
<div id="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div> Sites you visited</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div> Advertising tracker</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div> Analytics</div>
  <div class="legend-item"><div class="legend-dot" style="background:#a855f7"></div> Social media</div>
  <div class="legend-item"><div class="legend-dot" style="background:#6b7280"></div> CDN / functional</div>
  <div class="legend-item"><div class="legend-dot" style="background:#eab308"></div> Previously stored cookie baseline</div>
</div>

<!-- tooltip -->
<div id="tooltip"></div>

<!-- graph -->
<div id="graph-container">
  <svg id="graph-svg"></svg>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>

// ── get session ID from URL ────────────────────────────────────────────────────
// URL is /graph/abc123  →  session ID is "abc123"
const SESSION_ID = window.location.pathname.split('/').pop();

// ── tracker classification ────────────────────────────────────────────────────
// Start with a small built-in fallback database so the graph can render
// immediately even if /api/services is slow or unavailable.
const TRACKER_DB = {
  // Advertising
  'doubleclick.net':       { company:'Google Ads',        type:'advertiser', purpose:'Tracks ad clicks and conversions across the web' },
  'googlesyndication.com': { company:'Google AdSense',    type:'advertiser', purpose:'Serves and tracks display advertisements' },
  'adnxs.com':             { company:'Microsoft Xandr',   type:'advertiser', purpose:'Programmatic advertising and audience targeting' },
  'rubiconproject.com':    { company:'Magnite',           type:'advertiser', purpose:'Real-time bidding for ad placement' },
  'pubmatic.com':          { company:'PubMatic',          type:'advertiser', purpose:'Ad exchange and yield management' },
  'openx.net':             { company:'OpenX',             type:'advertiser', purpose:'Programmatic ad marketplace' },
  'taboola.com':           { company:'Taboola',           type:'advertiser', purpose:'Content recommendation and native ads' },
  'outbrain.com':          { company:'Outbrain',          type:'advertiser', purpose:'Sponsored content recommendations' },

  // Analytics
  'google-analytics.com':  { company:'Google Analytics',  type:'analytics',  purpose:'Website visitor tracking and behaviour analysis' },
  'googletagmanager.com':  { company:'Google Tag Manager',type:'analytics',  purpose:'Manages and deploys tracking scripts' },
  'hotjar.com':            { company:'Hotjar',            type:'analytics',  purpose:'Session recording, heatmaps, user surveys' },
  'mixpanel.com':          { company:'Mixpanel',          type:'analytics',  purpose:'Product analytics and user event tracking' },
  'segment.com':           { company:'Segment',           type:'analytics',  purpose:'Customer data platform — collects and routes user data' },
  'amplitude.com':         { company:'Amplitude',         type:'analytics',  purpose:'Product analytics and user behaviour tracking' },
  'clarity.ms':            { company:'Microsoft Clarity', type:'analytics',  purpose:'Session recording and heatmaps' },

  // Social
  'facebook.net':          { company:'Meta (Facebook)',   type:'social',     purpose:'Tracks your activity to target Facebook/Instagram ads' },
  'facebook.com':          { company:'Meta (Facebook)',   type:'social',     purpose:'Social login, like buttons, pixel tracking' },
  'twitter.com':           { company:'X (Twitter)',       type:'social',     purpose:'Tweet buttons and cross-site tracking' },
  'linkedin.com':          { company:'LinkedIn',          type:'social',     purpose:'Professional audience tracking for LinkedIn ads' },
  'pinterest.com':         { company:'Pinterest',         type:'social',     purpose:'Pinterest pixel — tracks purchases and page views' },

  // CDN / functional
  'googleapis.com':        { company:'Google APIs',       type:'cdn',        purpose:'Fonts, maps, and utility APIs — usually non-tracking' },
  'gstatic.com':           { company:'Google Static',     type:'cdn',        purpose:'Serves static assets (fonts, images) for Google services' },
  'cloudflare.com':        { company:'Cloudflare',        type:'cdn',        purpose:'Content delivery network and DDoS protection' },
  'cloudflareinsights.com':{ company:'Cloudflare',        type:'analytics',  purpose:'Basic traffic analytics' },
  'jsdelivr.net':          { company:'jsDelivr CDN',      type:'cdn',        purpose:'Open source content delivery network' },
  'bootstrapcdn.com':      { company:'Bootstrap CDN',     type:'cdn',        purpose:'Serves Bootstrap CSS/JS framework files' },
};

function mapDisconnectCategory(category) {
  const c = String(category || '').toLowerCase();

  if (c === 'analytics') return 'analytics';
  if (c === 'social') return 'social';
  if (c === 'content') return 'cdn';

  // Advertising, Email, Fingerprinting, Cryptomining and any other
  // Disconnect tracking category are shown as trackers.
  return 'tracker';
}

function purposeForCategory(category) {
  const descriptions = {
    Advertising: 'Used for advertising, audience profiling, targeting or measuring ad performance.',
    Analytics: 'Used to measure website usage and analyse visitor behaviour.',
    Social: 'Used by social media services and may connect activity across websites.',
    Content: 'Provides third-party content or functionality used by the website.',
    Email: 'Associated with email delivery, marketing or email interaction tracking.',
    FingerprintingGeneral: 'May identify or recognise browsers using browser or device characteristics.',
    FingerprintingInvasive: 'Uses browser or device characteristics for potentially invasive fingerprinting.',
    Cryptomining: 'May use browser resources for cryptocurrency mining.'
  };

  return descriptions[category] || `Listed by Disconnect in the category "${category}".`;
}

async function loadTrackerDatabase() {
  try {
    const res = await fetch('/api/services');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const services = await res.json();
    const categories = services && services.categories;

    if (!categories || typeof categories !== 'object') {
      throw new Error('services.json has no categories object');
    }

    let loadedDomains = 0;

    for (const [category, companies] of Object.entries(categories)) {
      if (!Array.isArray(companies)) continue;

      for (const companyEntry of companies) {
        if (!companyEntry || typeof companyEntry !== 'object') continue;

        for (const [company, companyData] of Object.entries(companyEntry)) {
          if (!companyData || typeof companyData !== 'object') continue;

          // A company normally contains one homepage key whose value is an
          // array of domains. Some entries also contain metadata such as
          // "session-replay": "true"; those values are deliberately skipped.
          for (const [homepage, domains] of Object.entries(companyData)) {
            if (!Array.isArray(domains)) continue;

            for (const rawDomain of domains) {
              if (typeof rawDomain !== 'string') continue;

              const cleanDomain = rawDomain
                .trim()
                .toLowerCase()
                .replace(/^www\./, '');

              if (!cleanDomain) continue;

              TRACKER_DB[cleanDomain] = {
                company,
                type: mapDisconnectCategory(category),
                category,
                homepage,
                purpose: purposeForCategory(category)
              };

              loadedDomains++;
            }
          }
        }
      }
    }

    console.log(`[FreeFollowers] Disconnect database loaded: ${loadedDomains} domain entries`);

    // Refresh once so visible nodes and the stored-cookie baseline can be
    // reclassified using the full Disconnect database.
    if (latestGraphData) updateGraph(latestGraphData);
    else fetchGraph();
  } catch (err) {
    // Important: classification failure must never stop the graph itself.
    console.warn('[FreeFollowers] Could not load Disconnect database. Using fallback classification.', err);
  }
}

function lookupTrackerDomain(domain) {
  if (!domain) {
    return {
      matched: false,
      info: {
        company: 'Unknown',
        type: 'unknown',
        purpose: 'No information available for this domain'
      }
    };
  }

  const cleanDomain = String(domain)
    .trim()
    .toLowerCase()
    .replace(/^\./, '')
    .replace(/^www\./, '');

  if (TRACKER_DB[cleanDomain]) {
    return { matched: true, info: TRACKER_DB[cleanDomain] };
  }

  const parts = cleanDomain.split('.');
  for (let i = 1; i < parts.length - 1; i++) {
    const parentDomain = parts.slice(i).join('.');
    if (TRACKER_DB[parentDomain]) {
      return { matched: true, info: TRACKER_DB[parentDomain] };
    }
  }

  return {
    matched: false,
    info: {
      company: cleanDomain,
      type: 'unknown',
      purpose: 'This domain is not listed in the Disconnect tracker database.'
    }
  };
}

function classifyDomain(domain) {
  return lookupTrackerDomain(domain).info;
}


function nodeColor(type) {
  const colors = {
    site:       '#3b82f6',
    advertiser: '#ef4444',
    analytics:  '#f97316',
    social:     '#a855f7',
    cdn:        '#6b7280',
    unknown:    '#64748b',
    tracker:    '#ef4444',  // fallback for unclassified trackers
    'stored-root': '#eab308',
  };
  return colors[type] || colors.unknown;
}

// ── D3 setup ─────────────────────────────────────────────────────────────────
const svg = d3.select('#graph-svg');
const width  = window.innerWidth;
const height = window.innerHeight;

// g = main group — everything goes inside so we can zoom/pan
const g = svg.append('g');

// zoom behaviour — scroll to zoom, drag to pan
const zoomBehaviour = d3.zoom()
  .scaleExtent([0.05, 4])
  .filter(event => {
    // only zoom on scroll if cursor is over the SVG
    // prevent default to stop page scrolling while zooming
    if (event.type === 'wheel') {
      event.preventDefault();
      return true;
    }
    return !event.button;
  })
  .wheelDelta(event => -event.deltaY * 0.0008)
  .on('zoom', (event) => g.attr('transform', event.transform));

svg.call(zoomBehaviour);

// prevent page scroll when mouse is over SVG
document.getElementById('graph-svg').addEventListener('wheel',
  e => e.preventDefault(), { passive: false });

// containers — links behind nodes
const linkGroup = g.append('g').attr('class', 'links');
const nodeGroup = g.append('g').attr('class', 'nodes');

// force simulation
const simulation = d3.forceSimulation()
  .alphaDecay(0.05)       // settles faster (default is 0.0228)
  .velocityDecay(0.4)     // more friction — nodes slow down quicker
  .force('link',   d3.forceLink().id(d => d.id).distance(100))
  .force('charge', d3.forceManyBody().strength(-300))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 5));

function nodeRadius(d) {
  // sites slightly bigger, size scales with connection count
  const base = d.type === 'stored-root' ? 15 : (d.type === 'site' ? 12 : 8);
  return base + Math.min(d.count || 1, 10);
}

// ── tooltip ───────────────────────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');

function showTooltip(event, d, edgeData) {
  let html = '';

  if (edgeData) {
    if (edgeData.kind === 'existing') {
      const targetId = edgeData.target.id || edgeData.target;
      const info = classifyDomain(targetId);
      html = `
        <h3>Previously stored → ${targetId}</h3>
        <div class="tt-row"><span>Tracker</span><span>${info.company}</span></div>
        <div class="tt-row"><span>Baseline cookies</span><span>${edgeData.cookieCount || 1}</span></div>
        <div class="tt-cookies">
          <strong>What this means:</strong>
          Cookies for this tracker domain were already present when this FreeFollowers browser session started. The original website that created them is not known retrospectively.
        </div>
      `;
    } else {
      const info = classifyDomain(edgeData.target.id || edgeData.target);
      html = `
        <h3>${edgeData.source.id || edgeData.source} → ${edgeData.target.id || edgeData.target}</h3>
        <div class="tt-row"><span>Tracker</span><span>${info.company}</span></div>
        <div class="tt-row"><span>Purpose</span><span>${info.purpose}</span></div>
        ${edgeData.cookies && edgeData.cookies.length > 0 ? `
          <div class="tt-cookies">
            <strong>Cookies observed (${edgeData.cookies.length}):</strong>
            ${edgeData.cookies.slice(0, 6).join(', ')}${edgeData.cookies.length > 6 ? '…' : ''}
          </div>` : ''}
      `;
    }
  } else if (d && d.type === 'stored-root') {
    html = `
      <h3>Previously stored</h3>
      <div class="tt-cookies">
        This branch contains tracker-cookie domains that were already stored in the browser when this FreeFollowers session started. It does not claim which historical website created each cookie.
      </div>
    `;
  } else {
    const info = classifyDomain(d.id);
    const typeLabel = { site:'Site you visited', advertiser:'Advertising tracker',
                        analytics:'Analytics', social:'Social media',
                        cdn:'CDN / Functional', unknown:'Unknown tracker',
                        tracker:'Tracker' };
    html = `
      <h3>${info.company}</h3>
      <div class="tt-row"><span>Domain</span><span>${d.id}</span></div>
      <div class="tt-row"><span>Type</span><span>${typeLabel[info.type] || info.type}</span></div>
      <div class="tt-row"><span>Seen</span><span>${d.count || 1}×</span></div>
      ${d.existingCookieCount ? `<div class="tt-row"><span>Baseline cookies</span><span>${d.existingCookieCount}</span></div>` : ''}
      <div class="tt-cookies">
        <strong>What they do:</strong>
        ${info.purpose}
      </div>
    `;
  }

  tooltip.innerHTML = html;
  tooltip.classList.add('visible');
  moveTooltip(event);
}

function moveTooltip(event) {
  const x = event.clientX + 15;
  const y = event.clientY - 10;
  // keep tooltip on screen
  const maxX = window.innerWidth  - 280;
  const maxY = window.innerHeight - 200;
  tooltip.style.left = Math.min(x, maxX) + 'px';
  tooltip.style.top  = Math.min(y, maxY) + 'px';
}

function hideTooltip() {
  tooltip.classList.remove('visible');
}

// ── graph rendering ───────────────────────────────────────────────────────────
let currentNodes = [];
let currentEdges = [];
let latestGraphData = null;
let graphMode = 'new';

function normaliseExistingCookieDomains(raw) {
  if (!Array.isArray(raw)) return [];

  return raw.map(item => {
    if (typeof item === 'string') return { domain: item, count: 1 };
    return {
      domain: String(item && item.domain || ''),
      count: Number(item && item.count || 1)
    };
  }).filter(item => item.domain);
}

function buildDisplayData(data) {
  const nodes = (data.nodes || []).map(n => ({ ...n }));
  const edges = (data.edges || []).map(e => ({ ...e }));

  if (graphMode !== 'all') return { nodes, edges };

  const existing = normaliseExistingCookieDomains(data.existing_cookie_domains);
  const knownById = new Map(nodes.map(n => [n.id, n]));
  const baselineTrackers = [];

  existing.forEach(item => {
    const domain = item.domain
      .trim()
      .toLowerCase()
      .replace(/^\./, '')
      .replace(/^www\./, '');

    const match = lookupTrackerDomain(domain);

    // "All trackers" should not turn every login/preference cookie into a
    // tracker. Only domains positively matched by Disconnect are added.
    if (!match.matched || match.info.type === 'cdn') return;

    baselineTrackers.push({ domain, count: item.count, info: match.info });
  });

  if (baselineTrackers.length === 0) return { nodes, edges };

  const rootId = '__previously_stored__';
  nodes.push({
    id: rootId,
    type: 'stored-root',
    nodeType: 'stored-root',
    company: 'Previously stored',
    count: baselineTrackers.length
  });

  baselineTrackers.forEach(item => {
    let node = knownById.get(item.domain);

    if (!node) {
      node = {
        id: item.domain,
        type: 'tracker',
        count: 1,
        source: 'existing'
      };
      nodes.push(node);
      knownById.set(item.domain, node);
    }

    node.existingCookieCount = item.count;

    edges.push({
      id: `${rootId}→${item.domain}`,
      source: rootId,
      target: item.domain,
      kind: 'existing',
      cookieCount: item.count,
      cookies: []
    });
  });

  return { nodes, edges };
}

function setGraphMode(mode) {
  graphMode = mode === 'all' ? 'all' : 'new';
  document.getElementById('mode-new').classList.toggle('active', graphMode === 'new');
  document.getElementById('mode-all').classList.toggle('active', graphMode === 'all');
  document.getElementById('mode-note').textContent = graphMode === 'new'
    ? 'New trackers = observed during this browser session'
    : 'All trackers = this session + tracker-cookie domains already stored at session start';

  prevNodeCount = -1;
  prevEdgeCount = -1;

  if (latestGraphData) updateGraph(latestGraphData);
}

document.getElementById('mode-new').addEventListener('click', () => setGraphMode('new'));
document.getElementById('mode-all').addEventListener('click', () => setGraphMode('all'));

// track previous counts to avoid unnecessary restarts
let prevNodeCount = 0;
let prevEdgeCount = 0;

function updateGraph(data) {
  latestGraphData = data;
  const display = buildDisplayData(data);
  let nodes = display.nodes;
  const edges = display.edges;

  if (nodes.length === 0) {
    document.getElementById('waiting').classList.remove('hidden');
    return;
  }

  // ── filter out isolated nodes ─────────────────────────────────────────────
  // Only show nodes that either:
  // a) have at least one edge connected to them, OR
  // b) are a site you directly visited
  const connectedIds = new Set();
  edges.forEach(e => {
    connectedIds.add(e.source.id || e.source);
    connectedIds.add(e.target.id || e.target);
  });
  nodes = nodes.filter(n => n.type === 'site' || n.type === 'stored-root' || connectedIds.has(n.id));

  // hide waiting message
  document.getElementById('waiting').classList.add('hidden');

  // enrich nodes with classification
  nodes.forEach(n => {
    if (n.type === 'stored-root') {
      n.nodeType = 'stored-root';
      n.company = 'Previously stored';
    } else if (n.type !== 'site') {
      const info = classifyDomain(n.id);
      n.nodeType = info.type;
      n.company  = info.company;
    } else {
      n.nodeType = 'site';
      n.company  = n.id;
    }
  });

  // update stats bar
  document.getElementById('stat-sites').textContent =
    nodes.filter(n => n.type === 'site').length;
  document.getElementById('stat-trackers').textContent =
    nodes.filter(n => n.type !== 'site' && n.type !== 'stored-root').length;
  document.getElementById('stat-edges').textContent = edges.length;

  // preserve positions of existing nodes so graph doesn't jump
  const existingById = {};
  currentNodes.forEach(n => existingById[n.id] = n);
  nodes.forEach(n => {
    if (existingById[n.id]) {
      n.x  = existingById[n.id].x;
      n.y  = existingById[n.id].y;
      n.vx = existingById[n.id].vx;
      n.vy = existingById[n.id].vy;
    }
  });

  currentNodes = nodes;
  currentEdges = edges;

  // ── links ──────────────────────────────────────────────────────────────────
  const link = linkGroup.selectAll('line')
    .data(edges, d => d.id)
    .join(
      enter => enter.append('line')
        .attr('class', 'link')
        .attr('stroke', 'rgba(255,255,255,0.12)')
        .on('mouseover', (event, d) => showTooltip(event, null, d))
        .on('mousemove', moveTooltip)
        .on('mouseout',  hideTooltip),
      update => update,
      exit   => exit.remove()
    );

  // ── nodes ──────────────────────────────────────────────────────────────────
  const node = nodeGroup.selectAll('g.node')
    .data(nodes, d => d.id)
    .join(
      enter => {
        const g = enter.append('g').attr('class', 'node')
          .call(d3.drag()
            .on('start', dragStart)
            .on('drag',  dragging)
            .on('end',   dragEnd))
          .on('mouseover', (event, d) => showTooltip(event, d, null))
          .on('mousemove', moveTooltip)
          .on('mouseout',  hideTooltip);

        g.append('circle')
          .attr('r', d => nodeRadius(d))
          .attr('fill', d => nodeColor(d.nodeType));

        g.append('text')
          .attr('dy', d => nodeRadius(d) + 11)
          .text(d => d.id.length > 20 ? d.id.slice(0, 18) + '…' : d.id);

        return g;
      },
      update => {
        update.select('circle')
          .attr('r',    d => nodeRadius(d))
          .attr('fill', d => nodeColor(d.nodeType));
        return update;
      },
      exit => exit.remove()
    );

  // ── restart simulation ─────────────────────────────────────────────────────
  simulation.nodes(nodes).on('tick', () => {
    link
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);

    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  simulation.force('link').links(edges);

  // only kick the simulation if something actually changed
  // otherwise nodes drift forever from constant restarts
  const changed = nodes.length !== prevNodeCount || edges.length !== prevEdgeCount;
  if (changed) {
    prevNodeCount = nodes.length;
    prevEdgeCount = edges.length;
    simulation.alpha(0.3).restart();
    // auto-fit once simulation settles
    simulation.on('end', fitGraph);
  }
}

// ── auto-fit: zoom to show all nodes ─────────────────────────────────────────
function fitGraph() {
  if (currentNodes.length === 0) return;

  // find bounding box of all nodes
  let minX = Infinity, maxX = -Infinity;
  let minY = Infinity, maxY = -Infinity;
  currentNodes.forEach(n => {
    if (n.x == null) return;
    minX = Math.min(minX, n.x);
    maxX = Math.max(maxX, n.x);
    minY = Math.min(minY, n.y);
    maxY = Math.max(maxY, n.y);
  });

  if (!isFinite(minX)) return;

  const padding = 80;
  const graphW = maxX - minX + padding * 2;
  const graphH = maxY - minY + padding * 2;
  const scaleX = window.innerWidth  / graphW;
  const scaleY = window.innerHeight / graphH;
  const scale  = Math.min(scaleX, scaleY, 1.5);  // never zoom in more than 1.5x

  const tx = window.innerWidth  / 2 - scale * (minX + maxX) / 2;
  const ty = window.innerHeight / 2 - scale * (minY + maxY) / 2;

  svg.transition().duration(600)
    .call(zoomBehaviour.transform,
      d3.zoomIdentity.translate(tx, ty).scale(scale));
}

// ── drag handlers ─────────────────────────────────────────────────────────────
function dragStart(event, d) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragging(event, d) {
  d.fx = event.x; d.fy = event.y;
}
function dragEnd(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// ── poll Flask for updates every 2 seconds ────────────────────────────────────
async function fetchGraph() {
  try {
    const res = await fetch(`/api/graph/${SESSION_ID}`);
    if (!res.ok) return;
    const data = await res.json();
    if (data.found) updateGraph(data);
  } catch (err) {
    console.warn('Could not fetch graph:', err);
  }
}

// Start graph polling immediately. Never wait for services.json.
fetchGraph();
setInterval(fetchGraph, 2000);

// Load the larger Disconnect classification database separately.
// If it fails, the graph still works with the built-in fallback list.
loadTrackerDatabase();

// ── resize handler ────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  simulation.force('center', d3.forceCenter(window.innerWidth / 2, window.innerHeight / 2));
  simulation.alpha(0.1).restart();
});

</script>
