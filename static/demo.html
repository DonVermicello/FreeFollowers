<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>FreeFollowers — Sample Tracker Cloud</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0a0f; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden; height: 100vh; width: 100vw;
      touch-action: none;
    }
    svg { width:100%; height:100%; }
 
    /* topbar */
    #topbar {
      position:fixed; top:0; left:0; right:0; height:52px;
      background:rgba(10,10,15,0.92); backdrop-filter:blur(8px);
      border-bottom:1px solid rgba(255,255,255,0.07);
      display:flex; align-items:center; padding:0 16px; gap:14px; z-index:100;
    }
    #topbar h1 { font-size:14px; font-weight:700; white-space:nowrap; }
    .stat { font-size:12px; color:rgba(255,255,255,0.5); white-space:nowrap; }
    .stat span { color:white; font-weight:600; }
    .demo-badge {
      margin-left:auto; padding:4px 10px;
      background:rgba(230,57,70,0.15); border:1px solid rgba(230,57,70,0.3);
      border-radius:20px; font-size:11px; color:#e63946;
      white-space:nowrap; letter-spacing:0.04em;
    }
    #fit-btn {
      padding:5px 14px;
      background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12);
      border-radius:6px; color:white; font-size:12px; cursor:pointer;
      white-space:nowrap;
    }
    #fit-btn:hover { background:rgba(255,255,255,0.12); }
 
    /* install banner */
    #install-banner {
      position:fixed; bottom:0; left:0; right:0;
      background:rgba(10,10,15,0.95); backdrop-filter:blur(8px);
      border-top:1px solid rgba(255,255,255,0.07);
      padding:14px 20px;
      display:flex; align-items:center; gap:14px; z-index:100;
      flex-wrap:wrap;
    }
    #install-banner p { font-size:13px; color:rgba(255,255,255,0.6); flex:1; min-width:200px; }
    #install-banner p strong { color:white; }
    .btn-install {
      padding:9px 20px; background:#e63946; color:white;
      border-radius:6px; text-decoration:none; font-size:13px; font-weight:600;
      white-space:nowrap; transition:background 0.2s;
    }
    .btn-install:hover { background:#c1121f; }
    .btn-close {
      background:none; border:none; color:rgba(255,255,255,0.3);
      cursor:pointer; font-size:18px; padding:4px;
    }
    .btn-close:hover { color:white; }
 
    /* legend */
    #legend {
      position:fixed; bottom:80px; left:14px;
      background:rgba(10,10,15,0.88); backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,0.08); border-radius:10px;
      padding:12px 14px; font-size:11px; z-index:50;
    }
    .li { display:flex; align-items:center; gap:8px; margin-bottom:5px; color:rgba(255,255,255,0.65); }
    .li:last-child { margin-bottom:0; }
    .ld { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
 
    /* tooltip */
    #tooltip {
      position:fixed; background:rgba(10,10,15,0.97);
      border:1px solid rgba(255,255,255,0.12); border-radius:10px;
      padding:12px 14px; font-size:12px; max-width:240px;
      pointer-events:none; opacity:0; transition:opacity 0.15s; z-index:200;
      line-height:1.6;
    }
    #tooltip.vis { opacity:1; }
    #tooltip h3 { font-size:13px; font-weight:600; margin-bottom:6px; }
    .tt-row { display:flex; justify-content:space-between; gap:10px; margin-bottom:2px; }
    .tt-row .l { color:rgba(255,255,255,0.5); }
    .tt-row .v { color:white; text-align:right; }
    .tt-cookies { margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.08); font-size:11px; color:rgba(255,255,255,0.4); }
    .tt-cookies strong { color:rgba(255,255,255,0.7); display:block; margin-bottom:2px; }
 
    .node circle { cursor:pointer; stroke:rgba(255,255,255,0.12); stroke-width:1; }
    .node circle:hover { stroke:white; stroke-width:2; }
    .node text { fill:rgba(255,255,255,0.7); font-size:9.5px; pointer-events:none; text-anchor:middle; }
    .link { stroke:rgba(255,255,255,0.1); stroke-width:1; }
 
    /* mobile hint */
    #mobile-hint {
      position:fixed; top:60px; left:50%; transform:translateX(-50%);
      background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
      border-radius:20px; padding:6px 16px; font-size:11px; color:rgba(255,255,255,0.4);
      pointer-events:none; z-index:50; white-space:nowrap;
      animation: fadeout 3s 2s forwards;
    }
    @keyframes fadeout { to { opacity:0; } }

function nodeColor(type) {
  return { site:'#3b82f6', advertiser:'#ef4444', analytics:'#f97316',
           social:'#a855f7', cdn:'#6b7280' }[type] || '#64748b';
}
function nodeRadius(d) {
  return (d.type === 'site' ? 10 : 6) + Math.min(d.count||1, 12) * 0.6;
}
 
// ── D3 SETUP ────────────────────────────────────────────────────────────────
const W = window.innerWidth, H = window.innerHeight;
const svg = d3.select('#graph-svg');
const g = svg.append('g');
 
const zoom = d3.zoom()
  .scaleExtent([0.05, 4])
  .filter(e => { if(e.type==='wheel'){e.preventDefault();return true;} return !e.button; })
  .wheelDelta(e => -e.deltaY * 0.003)
  .on('zoom', e => g.attr('transform', e.transform));
 
svg.call(zoom);
document.getElementById('graph-svg').addEventListener('wheel', e => e.preventDefault(), {passive:false});
 
const linkG = g.append('g');
const nodeG = g.append('g');
 
const simulation = d3.forceSimulation(NODES)
  .alphaDecay(0.03)
  .velocityDecay(0.45)
  .force('link', d3.forceLink(EDGES).id(d=>d.id).distance(55))
  .force('charge', d3.forceManyBody().strength(-150))
  .force('center', d3.forceCenter(W/2, H/2))
  .force('collision', d3.forceCollide().radius(d=>nodeRadius(d)+4));

    html = `<h3>${edge.source.id||edge.source} → ${edge.target.id||edge.target}</h3>
      <div class="tt-row"><span class="l">Company</span><span class="v">${info.company||edge.target.id||edge.target}</span></div>
      ${edge.cookies&&edge.cookies.length ? `<div class="tt-cookies"><strong>Cookies shared (${edge.cookies.length}):</strong>${edge.cookies.slice(0,5).join(', ')}</div>` : ''}`;
  } else {
    const info = TRACKER_INFO[d.id] || {};
    const typeLabel = {site:'Site you visited',advertiser:'Advertising tracker',analytics:'Analytics',social:'Social media',cdn:'CDN / Functional'};
    html = `<h3>${info.company||d.id}</h3>
      <div class="tt-row"><span class="l">Domain</span><span class="v">${d.id}</span></div>
      <div class="tt-row"><span class="l">Type</span><span class="v">${typeLabel[d.type]||d.type}</span></div>
      <div class="tt-row"><span class="l">Seen</span><span class="v">${d.count||1}×</span></div>
      ${info.purpose ? `<div class="tt-cookies"><strong>What they do:</strong>${info.purpose}</div>` : ''}`;
  }
  tooltip.innerHTML = html;
  tooltip.classList.add('vis');
  moveTip(e);
}
function moveTip(e) {
  const cx = e.clientX||e.touches?.[0]?.clientX||0;
  const cy = e.clientY||e.touches?.[0]?.clientY||0;
  tooltip.style.left = Math.min(cx+14, window.innerWidth-260)+'px';
  tooltip.style.top  = Math.min(cy-10, window.innerHeight-180)+'px';
}
function hideTip() { tooltip.classList.remove('vis'); }
 
// ── RENDER ───────────────────────────────────────────────────────────────────
const link = linkG.selectAll('line').data(EDGES).join('line').attr('class','link')
  .on('mouseover', (e,d)=>showTip(e,null,d))
  .on('mousemove', moveTip)
  .on('mouseout', hideTip);
 
const node = nodeG.selectAll('g').data(NODES).join('g').attr('class','node')
  .call(d3.drag()
    .on('start',(e,d)=>{ if(!e.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x;d.fy=d.y; })
    .on('drag', (e,d)=>{ d.fx=e.x;d.fy=e.y; })
    .on('end',  (e,d)=>{ if(!e.active) simulation.alphaTarget(0); d.fx=null;d.fy=null; }))
  .on('mouseover', (e,d)=>showTip(e,d,null))
  .on('mousemove', moveTip)
  .on('mouseout', hideTip)
  .on('touchstart', (e,d)=>{ e.preventDefault(); showTip(e,d,null); }, {passive:false})
  .on('touchend', hideTip);
 
node.append('circle')
  .attr('r', d=>nodeRadius(d))
  .attr('fill', d=>nodeColor(d.type));
 
node.append('text')
  .attr('dy', d=>nodeRadius(d)+10)
  .text(d=>d.id.length>18?d.id.slice(0,16)+'…':d.id);
 
simulation.on('tick', () => {
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
      .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('transform',d=>`translate(${d.x},${d.y})`);
}).on('end', fitGraph);
 
// ── STATS ────────────────────────────────────────────────────────────────────
document.getElementById('s-sites').textContent    = NODES.filter(n=>n.type==='site').length;
document.getElementById('s-trackers').textContent = NODES.filter(n=>n.type!=='site').length;
document.getElementById('s-edges').textContent    = EDGES.length;
 
// ── FIT ──────────────────────────────────────────────────────────────────────
function fitGraph() {
  const ns = NODES.filter(n=>n.x!=null);
  if (!ns.length) return;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  ns.forEach(n=>{ minX=Math.min(minX,n.x);maxX=Math.max(maxX,n.x);minY=Math.min(minY,n.y);maxY=Math.max(maxY,n.y); });
  const pad=80, gw=maxX-minX+pad*2, gh=maxY-minY+pad*2;
  const scale=Math.min(window.innerWidth/gw, (window.innerHeight-52-70)/gh, 1.5);
  const tx=window.innerWidth/2-scale*(minX+maxX)/2;
  const ty=(window.innerHeight-52)/2+52-scale*(minY+maxY)/2;
  svg.transition().duration(600)
    .call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(scale));
}
 
window.addEventListener('resize',()=>{
  simulation.force('center',d3.forceCenter(window.innerWidth/2,window.innerHeight/2));
  simulation.alpha(0.1).restart();
});
</script>
</body>
</html>
